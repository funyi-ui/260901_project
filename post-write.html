<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새 글 쓰기 | HANEUL.LOG</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body class="write-page"><a class="skip-link" href="#editor-title">편집기로 바로가기</a>
