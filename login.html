<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | HANEUL.LOG</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body class="auth-page"><a class="skip-link" href="#main">본문 바로가기</a><header class="auth-header"><a class="logo" href="index.html">HANEUL<span>.LOG</span></a><a href="index.html">← 블로그로 돌아가기</a></header>
<main id="main" class="auth-main"><section class="auth-intro"><p class="eyebrow">Welcome back</p><h1>다시 만나서<br><em>반가워요.</em></h1><p>로그인하고 글을 쓰거나 저장한 글을 이어서 편집해 보세요.</p><blockquote>“기록은 흩어진 생각을<br>나만의 언어로 만드는 일.”</blockquote></section><section class="auth-panel"><div class="auth-box"><p class="section-label">Sign in</p><h2>로그인</h2><p>계정 정보를 입력해 주세요.</p><form class="form-stack auth-form" data-auth-form><label>이메일<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required></label><label>비밀번호<span class="password-field"><input type="password" name="password" placeholder="8자 이상 입력" minlength="8" autocomplete="current-password" required><button class="password-toggle" type="button">보기</button></span></label><div class="form-options"><label class="check"><input type="checkbox" name="remember"> 로그인 상태 유지</label><a href="#">비밀번호 찾기</a></div><button class="submit-button" type="submit">로그인 <span>→</span></button><p class="form-message" aria-live="polite"></p></form><div class="divider"><span>또는</span></div><button class="social-button" type="button">G&nbsp;&nbsp; Google로 계속하기</button><p class="auth-switch">아직 계정이 없나요? <a href="signup.html">회원가입</a></p></div></section></main></body></html>
