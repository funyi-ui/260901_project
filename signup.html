<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | HANEUL.LOG</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body class="auth-page"><a class="skip-link" href="#main">본문 바로가기</a><header class="auth-header"><a class="logo" href="index.html">HANEUL<span>.LOG</span></a><a href="index.html">← 블로그로 돌아가기</a></header>
<main id="main" class="auth-main"><section class="auth-intro signup-intro"><p class="eyebrow">Join the journal</p><h1>당신의 이야기도<br><em>시작해 보세요.</em></h1><p>계정을 만들고 생각과 배움을 자신만의 기록으로 남겨 보세요.</p><ol><li><span>01</span>좋아하는 글을 저장하고</li><li><span>02</span>나만의 이야기를 쓰고</li><li><span>03</span>사람들과 생각을 나눠요</li></ol></section><section class="auth-panel"><div class="auth-box"><p class="section-label">Create account</p><h2>회원가입</h2><p>아래 정보를 입력해 주세요.</p><form class="form-stack auth-form" data-auth-form><label>이름<input type="text" name="name" placeholder="이름" autocomplete="name" required></label><label>이메일<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required></label><label>비밀번호<span class="password-field"><input type="password" name="password" placeholder="영문, 숫자 포함 8자 이상" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" autocomplete="new-password" required><button class="password-toggle" type="button">보기</button></span><small>영문과 숫자를 포함해 8자 이상 입력해 주세요.</small></label><label class="check terms"><input type="checkbox" required><span><a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의합니다.</span></label><button class="submit-button" type="submit">계정 만들기 <span>→</span></button><p class="form-message" aria-live="polite"></p></form><p class="auth-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p></div></section></main></body></html>
